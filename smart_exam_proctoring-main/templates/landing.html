<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Exam Proctoring System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Poppins', sans-serif;
        }
        .landing-card {
            background: var(--card-bg);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px;
            width: 90%;
            animation: slide-up 0.5s ease-out;
        }
        .landing-card h1 {
            color: var(--primary-color);
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }
        .landing-card p {
            color: #666;
            margin-bottom: 2rem;
        }
        .role-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }
        .role-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: #fff;
            border: 2px solid #eaeaea;
            border-radius: 15px;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 600;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }
        .role-btn img {
            width: 64px;
            height: 64px;
            margin-bottom: 1rem;
            opacity: 0.8;
            transition: all 0.3s ease;
        }
        .role-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border-color: var(--primary-color);
            color: var(--primary-color);
        }
        .role-btn:hover img {
            opacity: 1;
        }
        @keyframes slide-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Simple SVGs for icons directly inline to avoid missing static assets */
    </style>
</head>
<body>

    <div style="position: absolute; top: 20px; right: 20px;">
        <a href="/login" class="btn" style="padding: 8px 15px; font-size: 14px; margin-right: 10px;">Login</a>
        <a href="/logout" class="btn" style="padding: 8px 15px; font-size: 14px; background-color: var(--danger-color); color: white; border: none;">Logout</a>
    </div>
    <div class="landing-card">
        <h1>AI Smart Exam Proctoring System</h1>
        <p>Select Login Type</p>
        
        <div class="role-grid">
            <a href="/login" class="role-btn">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 1rem;">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                Student Portal
            </a>
            
            <a href="/admin/login" class="role-btn">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 1rem;">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                Admin Portal
            </a>
        </div>
    </div>
</body>
</html>
